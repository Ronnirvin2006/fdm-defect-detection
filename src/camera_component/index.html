<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#101419; color:#eef2f4; font:14px system-ui,sans-serif; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 12px; }
    button,select { font:inherit; border:1px solid #49616b; border-radius:5px; padding:10px 14px; color:#eef2f4; background:#202a32; min-height:42px; }
    #start { background:#197f81; } button:disabled { opacity:.5; }
    .preview { position:relative; background:#080b0d; border:1px solid #303a44; border-radius:6px; overflow:hidden; }
    video { display:block; width:100%; max-height:440px; min-height:180px; object-fit:contain; }
    #decision { position:absolute; left:10px; right:10px; bottom:10px; padding:12px; background:rgba(10,17,20,.92); border-left:3px solid #57c7c4; overflow-wrap:anywhere; }
    #label { font-weight:650; font-size:18px; } #feedback { margin-top:5px; }
    #status { padding:10px 0; color:#b7c5cb; min-height:40px; overflow-wrap:anywhere; }
    #status.error { color:#ffaf9c; }
    @media(max-width:500px) { video { max-height:360px; } #label { font-size:16px; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="start" type="button">Start camera</button>
    <button id="stop" type="button" disabled>Stop camera</button>
    <select id="camera" aria-label="Camera"><option value="environment">Rear camera</option><option value="user">Front camera</option></select>
  </div>
  <div class="preview"><video id="video" autoplay muted playsinline></video>
    <div id="decision"><div id="label">Camera stopped</div><div id="feedback"></div></div>
  </div>
  <div id="status" role="status" aria-live="polite">Ready</div>
  <canvas id="canvas" hidden></canvas>
  <script src="camera.js"></script>
</body>
</html>
